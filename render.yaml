services:
  - type: web
    name: resumeai
    runtime: python
    rootDir: ./
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput"
    startCommand: "gunicorn ResumeAI.wsgi:application --bind 0.0.0.0:$PORT --timeout 120"
    envVars:
      - key: DJANGO_SETTINGS_MODULE
        value: ResumeAI.settings
      - key: DEBUG
        value: "False"
      - key: PYTHON_VERSION
        value: 3.12.17