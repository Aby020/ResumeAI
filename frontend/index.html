<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#F5F4F1" />
    <meta
      name="description"
      content="ResumeAI — premium ATS scoring and career intelligence for your resume."
    />
    <title>ResumeAI</title>
    <script>
      // Theme bootstrap — applies the saved (or OS-preferred) theme to <html>
      // before first paint so there is no flash of the wrong theme. Mirrors
      // the storage key and matchMedia fallback in static/js/theme-init.js.
      ;(function () {
        'use strict'
        var key = 'resumeAI.theme'
        var saved = null
        try {
          saved = window.localStorage.getItem(key)
        } catch (e) {
          /* storage unavailable — fall through to system preference */
        }
        var theme
        if (saved === 'dark' || saved === 'light') {
          theme = saved
        } else if (
          window.matchMedia &&
          window.matchMedia('(prefers-color-scheme: dark)').matches
        ) {
          theme = 'dark'
        } else {
          theme = 'light'
        }
        document.documentElement.setAttribute('data-theme', theme)
      })()
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Syne:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
