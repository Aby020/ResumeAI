{% extends "auth_base.html" %}

{% block title %}
Forgot Password | ResumeAI
{% endblock %}

{% block content %}

<div class="row justify-content-center">

    <div class="col-md-6 col-lg-5">

        <div class="auth-card">

            <div class="card-body p-4 p-md-5">

                <div class="text-center mb-4">

                    <span class="auth-brand mb-3">
                        <i class="bi bi-key" aria-hidden="true"></i>
                    </span>

                    <h2 class="fw-bold mt-3 mb-1">Forgot Password?</h2>

                    <p class="text-muted mb-0">
                        Enter your email address and we'll send you a password reset link.
                    </p>

                </div>

                <form method="post">

                    {% csrf_token %}

                    <div class="mb-4">

                        <label for="id_email" class="form-label fw-semibold">Email Address</label>

                        <input
                            type="email"
                            name="email"
                            id="id_email"
                            class="form-control"
                            placeholder="you@example.com"
                            required
                        >

                    </div>

                    <button type="submit" class="btn btn-primary w-100 py-2">
                        <i class="bi bi-send me-1" aria-hidden="true"></i>
                        Send Reset Link
                    </button>

                </form>

                <div class="text-center mt-3">

                    <a href="{% url 'login' %}" class="text-decoration-none small">
                        <i class="bi bi-arrow-left me-1" aria-hidden="true"></i>
                        Back to Login
                    </a>

                </div>

            </div>

        </div>

    </div>

</div>

{% endblock %}
