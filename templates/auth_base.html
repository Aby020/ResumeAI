{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>
        {% block title %}
        ResumeAI
        {% endblock %}
    </title>

    <meta name="description" content="ResumeAI - AI Powered Resume Analysis Platform">

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="{% static 'images/favicon/favicon.ico' %}">

    <!-- Inter font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{% static 'css/bootstrap.min.css' %}">

    <link rel="stylesheet" href="{% static 'vendors/bootstrap-icons/bootstrap-icons.css' %}">

    <link rel="stylesheet" href="{% static 'css/style.css' %}">

</head>

<body class="auth-body" data-bs-theme="light">

    <!-- Theme toggle -->
    <button class="btn btn-sm btn-outline-secondary auth-theme-toggle" type="button" data-theme-toggle
        aria-label="Switch color theme" title="Switch color theme">
        <i class="bi bi-moon-stars" data-theme-icon aria-hidden="true"></i>
    </button>

    <div class="container">

        {% if messages %}

            {% for message in messages %}

                <div class="alert alert-{{ message.tags }} alert-dismissible fade show mb-4" role="alert">

                    {{ message }}

                    <button type="button" class="btn-close" data-bs-dismiss="alert"></button>

                </div>

            {% endfor %}

        {% endif %}

        {% block content %}

        {% endblock %}

    </div>

    <script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

    <script src="{% static 'js/main.js' %}"></script>

    {% block extra_js %}
    {% endblock %}

</body>

</html>
