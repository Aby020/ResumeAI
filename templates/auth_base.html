{% load static %}

<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>

        {% block title %}

        ResumeAI

        {% endblock %}

    </title>

    <link rel="stylesheet"
          href="{% static 'css/bootstrap.min.css' %}">

    <link rel="stylesheet"
          href="{% static 'vendors/bootstrap-icons/bootstrap-icons.css' %}">

    <link rel="stylesheet"
          href="{% static 'css/style.css' %}">

</head>

<body
style="
background:#0f172a;
min-height:100vh;
display:flex;
align-items:center;
justify-content:center;
">

<div class="container">

    {% if messages %}

        {% for message in messages %}

            <div class="alert alert-{{ message.tags }}">

                {{ message }}

            </div>

        {% endfor %}

    {% endif %}

    {% block content %}

    {% endblock %}

</div>

<script src="{% static 'js/bootstrap.bundle.min.js' %}"></script>

</body>

</html>
